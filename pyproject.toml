[project]
name = "lightmeter"
version = "2.0.0"
description = "Driver and debug GUI for a calibrated ESP32-C3 light sensor (OPA323 + ADS1115)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
]

[project.scripts]
lightmeter = "lightmeter.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
