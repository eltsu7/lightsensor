[project]
name = "lightmeter"
version = "3.0.0"
description = "Driver and debug GUI for the RP2040/ADS1220 LightSensor v3."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
]

[project.scripts]
lightmeter = "lightmeter.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
